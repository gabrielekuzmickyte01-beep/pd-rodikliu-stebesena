name: Narkotinių medžiagų rodiklio atnaujinimas

on:
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: narkotiku-rodiklis
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Atsisiųsti saugyklą
        uses: actions/checkout@v4

      - name: Paruošti Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: updater-requirements.txt

      - name: Įdiegti priklausomybes
        run: python -m pip install -r updater-requirements.txt

      - name: Patikrinti ir atnaujinti narkotinių medžiagų rodiklį
        run: python update_drugs.py

      - name: Išsaugoti CSV pakeitimus
        run: |
          if git diff --quiet -- narkotiku_rodiklis.csv; then
            echo "Patikrinta – pokyčių nėra"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add narkotiku_rodiklis.csv
          git commit -m "Atnaujinti narkotinių medžiagų rodiklio duomenys"
          git push
